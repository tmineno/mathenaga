# 駅への改善案(docs/spec/site.md「改善案の起票」)。
# サイトの各駅のアイコンから開くと、station と page の欄が入った状態になる。
name: 駅への改善案
description: サイトの駅(概念・定理の単位)について、誤りの指摘や改善案を送る
title: '[改善案] '
labels: ['改善案']
body:
  - type: input
    id: station
    attributes:
      label: 駅
      description: 章と駅。サイトの駅のアイコンから開くと入っている
      placeholder: 第3章 完備性と不動点 / A04 バナッハの不動点定理(banach)
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: ページ
      description: その駅の URL
  - type: dropdown
    id: kind
    attributes:
      label: 種類
      options:
        - 誤り
        - 分かりにくい
        - 足りない
        - その他
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: 内容
      description: どこが・なぜ・どう直すとよいか
    validations:
      required: true
