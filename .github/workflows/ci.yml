# format → lint → typecheck → test。どれかが失敗したらマージできないよう、
# GitHub のブランチ保護でこのジョブ(check)を必須にする。docs/spec/build.md「CI と公開」。
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - name: Install the browser for the viewing tests
        run: npx playwright install --with-deps chromium
      - run: npm test
