# format → test(enaga check)。どれかが失敗したらマージできないよう、
# GitHub のブランチ保護でこのジョブ(check)を必須にする。ツールは enaga のリポジトリにあり、
# lint と typecheck はそちらの CI で行う(enaga の docs/spec/build.md「CI と公開」、ADR-010)。
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # pull_request ではマージコミットを取り出す。その1つ目の親(base)と比べて、変えたファイルを調べる
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      # 確かめはヘッドレスでだけ起動するので、ヘッドレス版の Chromium だけを入れる。
      - name: Install the browser for the site checks
        run: npx playwright install --with-deps --only-shell chromium
      - run: npm run check
      # 文献の一覧か確認の記録を変えた PR でだけ、検索 API で確認をやり直す。CI でネットワークを使うのは
      # この手順(と依存の取得)だけ。手で書いた確認の記録はここで見つかる(enaga の docs/spec/reference-check.md)。
      - name: Re-check the references changed in the pull request
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -qxE 'content/references(\.yml|\.verified\.json)'; then
            npm run refs:verify -- --check
          fi
