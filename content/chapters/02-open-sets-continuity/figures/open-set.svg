<svg xmlns="http://www.w3.org/2000/svg" width="360" height="300" viewBox="0 0 360 300" role="img" aria-label="開集合 U:どの点 a のまわりにも U に収まる開球 B(a, r) がとれ、境目に近い点 a′ では半径 r′ を小さくとる"><style>
.jp{font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',sans-serif;fill:#18202e}
.m{font-family:'Times New Roman','Noto Serif',serif;font-style:italic}
.up{font-style:normal}
.sub{font-size:12px;fill:#596377}
.set{fill:#ece8fa}
.edge-open{fill:none;stroke:#5b45b8;stroke-width:2;stroke-dasharray:6 5}
.edge-closed{fill:none;stroke:#5b45b8;stroke-width:2.5}
.ball{fill:#5b45b8;fill-opacity:.16;stroke:#5b45b8;stroke-width:1.5;stroke-dasharray:4 3}
.out{fill:#fbeedf;stroke:#a3560f;stroke-width:1.5;stroke-dasharray:4 3}
.warn{fill:#a3560f}
.ink{fill:#18202e}
.line{stroke:#18202e;stroke-width:1.2;fill:none}
.lead{stroke:#596377;stroke-width:1;fill:none}
@media (prefers-color-scheme:dark){
.jp{fill:#e4e8ef}.sub{fill:#a0a9b9}.set{fill:#221d38}
.edge-open,.edge-closed{stroke:#aa98f2}.ball{fill:#aa98f2;stroke:#aa98f2}
.out{fill:#31230f;stroke:#e69c59}.warn{fill:#e69c59}.ink{fill:#e4e8ef}.line{stroke:#e4e8ef}.lead{stroke:#a0a9b9}}</style><text class="jp" x="180" y="26" text-anchor="middle" font-size="16" font-weight="700">開集合 <tspan class="m">U</tspan></text>
<text class="jp sub" x="180" y="46" text-anchor="middle">境目(破線)は <tspan class="m">U</tspan> に含まない</text>
<path class="set" d="M 52 150 C 52 74 140 52 204 70 C 274 90 312 138 292 198 C 272 258 172 268 108 244 C 68 228 52 198 52 150 Z"/><path class="edge-open" d="M 52 150 C 52 74 140 52 204 70 C 274 90 312 138 292 198 C 272 258 172 268 108 244 C 68 228 52 198 52 150 Z"/>
<circle class="ball" cx="180" cy="160" r="56"/>
<line class="line" x1="180" y1="160" x2="236" y2="160"/>
<circle class="ink" cx="180" cy="160" r="3"/>
<text class="jp m" x="166" y="178" font-size="16">a</text>
<text class="jp m" x="204" y="154" font-size="16">r</text>
<text class="jp m" x="140" y="130" font-size="14">B<tspan class="up">(</tspan>a<tspan class="up">, </tspan>r<tspan class="up">)</tspan></text>
<circle class="ball" cx="271.2" cy="190.9" r="12"/>
<circle class="ink" cx="271.2" cy="190.9" r="2.5"/>
<text class="jp m" x="241.2" y="195.9" font-size="16">a′</text>
<path class="lead" d="M 279.2 200.9 L 300 252"/>
<text class="jp m" x="262" y="270" font-size="14">B<tspan class="up">(</tspan>a′<tspan class="up">, </tspan>r′<tspan class="up">)</tspan></text>
<text class="jp sub" x="180" y="294" text-anchor="middle">外に近い点ほど、小さな半径が要る</text></svg>
