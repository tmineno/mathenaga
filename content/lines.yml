# 路線ファイル(docs/spec/content-format.md「路線ファイル」)
# layout は幹線から分岐する向き(up / down / right)。書かない路線は幹線になる。
# planned は未執筆の章。全体の路線図にだけ灰色で描く。章を書いたら章フォルダを置き、ここから消す。
- id: reading
  code: Z
  name: 0番線
  color: "#8790A1"
  style: dotted
- id: main
  code: M
  name: 本線
  color: "#8790A1"
# 微積分線は始発の路線で、ほかの路線から分かれずに第10章から始まる(start: true。route-map.md「始発の路線」)。
# 入口の第10章は、本線の連続写像と解析線の完備性の2つを前提にする。後の章は、解析線のノルム空間・バナッハの不動点定理・
# ヒルベルト空間を前提の矢印で受ける。ほかの前提(開集合など)は、この路線の前の章を通ってたどれるので矢印にならない。
# 読む順:1変数の微分(第10章)→ 測度と積分(第11章)→ 2つをつなぐ微積分学の基本定理(第12章)。同じ順で多変数の微分(第13章)と
# 重積分(第14章)に進み、関数の空間(第15章)とフーリエ変換(第16章)で解析線のヒルベルト空間に戻る。
# 積分の理論はルベーグ積分だけにする。第12章の微積分学の基本定理はルベーグ積分で示し、連続関数の積分がリーマン和で近似できることだけを示す。
# 閉区間の事実(最大値、一様連続)は、第10章の閉区間上の連続関数で、第7章を通らずに実数の完備性から示す。
# 第11章のルベーグ測度で使う「[a,b] を可算個の開区間でおおうと長さの和が b−a 以上」も、完備性から示す。
# 全微分は線形写像で、逆関数定理の証明で作用素ノルムを使うので、ノルム空間を前提にする。逆関数定理はバナッハの不動点定理で示す。
# 第14章の変数変換公式は第13章の逆関数定理を使う。第16章の畳み込みとプランシュレルの定理は第14章のフビニの定理を、
# ガウス関数のフーリエ変換は第12章の積分記号下の微分と、第14章の極座標による変数変換(ガウス積分)を使う。
# 幾何線の接空間の章は第13章の陰関数定理を使う(未執筆の章どうしの前提は、書いてから矢印になる)。
# 第3章が認めて使っている平均値の定理と微積分学の基本定理、第4章の e^t のテイラー展開は、この路線で証明する。
# 解析線の作用素の章より前に読み、そこで L2(R) の位置演算子・運動量演算子と、ユニタリ作用素としてのフーリエ変換を例に使えるようにする。
# フーリエ級数は第5章(hilbert-space)で、区分的に連続な関数の内積空間で扱う。その空間を完備にしたものが L2 であることは、
# 第15章のリース・フィッシャーの定理(L2 は完備)と連続関数による近似(連続関数は L2 で稠密)が受け持つ。
# 上の段は路線ファイルの順に幹線に近い段から埋まるので、解析線より前に置いて、幹線と解析線の間の段に描く。
- id: calculus
  code: C
  name: 微積分線
  color: "#B83250"
  color_dark: "#F08AA0"
  layout: up
  start: true
  planned:
    - chapter: 10
      title: 微分と平均値の定理
      stations:
        - {name: 微分, requires: [continuous-map]}
        - {name: 閉区間上の連続関数, requires: [completeness]}
        - 平均値の定理
        - テイラーの定理
    - chapter: 11
      title: 測度と積分
      stations: [測度, {name: ルベーグ測度, requires: [open-set]}, ルベーグ積分, 収束定理]
    - chapter: 12
      title: 微分と積分
      stations: [微積分学の基本定理, リーマン和, 積分記号下の微分]
    - chapter: 13
      title: 多変数の微分
      stations: [{name: 全微分, requires: [normed-space]}, {name: 逆関数定理, requires: [banach]}, 陰関数定理]
    - chapter: 14
      title: 重積分
      stations: [フビニの定理, 変数変換公式]
    - chapter: 15
      title: Lp 空間
      stations: [Lp 空間, {name: リース・フィッシャーの定理, requires: [hilbert-space]}, 連続関数による近似]
    - chapter: 16
      title: フーリエ変換
      stations: [フーリエ変換, 畳み込み, プランシュレルの定理]
- id: analysis
  code: A
  name: 解析線
  color: "#5B45B8"
  color_dark: "#AA98F2"
  layout: up
  planned:
    - chapter: 17
      title: 有界作用素
      stations: [有界作用素, 双対空間, 随伴作用素]
    - chapter: 18
      title: スペクトル理論
      stations: [スペクトル, コンパクト作用素, スペクトル分解]
- id: geometry
  code: G
  name: 幾何線
  color: "#0F7F73"
  color_dark: "#4DC1B3"
  layout: down
  planned:
    - chapter: 19
      title: 接空間とベクトル場
      stations: [接空間, ベクトル場, リー微分]
    - chapter: 20
      title: 微分形式
      stations: [微分形式, 外微分, ストークスの定理]
# 集合線は 0番線から分かれる。既存の駅はどれもこの路線の駅を前提にしないので、章番号は後ろに置く。
- id: set-theory
  code: S
  name: 集合線
  color: "#A64F14"
  color_dark: "#E9A15C"
  layout: up
  planned:
    - chapter: 21
      title: 無限集合の大きさ
      stations: [濃度, 可算集合, 対角線論法]
      requires: [sets-maps]
      # 第0章の sets-maps から外した、この章で使う材料:正の整数全体から正の偶数全体への全単射
      # (全体と等しくない部分集合との全単射)と、X の冪集合から X → {0, 1} の写像の全体への全単射
      # (部分集合 A を、A の要素を 1 に、それ以外を 0 に写す写像に対応させる。X の要素が n 個なら、どちらも 2^n 個)。
    - chapter: 22
      title: 選択公理
      stations: [順序集合, 公理的集合論, 選択公理, ツォルンの補題]
      # 公理的集合論は、選択公理を足す相手(ほかの公理)を示すために、選択公理の前に置く。
      # 前の章(無限集合の大きさ)の対角線論法で使う集合 {x ∈ X | x ∉ f(x)} が、ラッセルのパラドックスと同じ形であることから入る。
      # 第0章の sets-maps の補足(remark)は、分出公理までしか書いていない。この駅を書いたら、補足からこの駅へ [[@ID]] でつなぐ。
